<html lang="en">
<head>

<title>Walk Check</title>
<meta name="description" content="Type your address and see what your child's walk to the new school crosses, where to cross, and how to ask HISD for a bus or the City for a school zone.">
<meta name="theme-color" content="#1F6E5A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&display=swap" rel="stylesheet">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" class="logo-bg"/>
    <path class="logo-road" d="M22 54 L42 74 L78 30" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="logo-dash" d="M22 54 L42 74 L78 30" fill="none" stroke-width="3" stroke-dasharray="6 7"/>
    <circle class="logo-home" cx="22" cy="54" r="10" stroke-width="3"/>
    <circle class="logo-school" cx="78" cy="30" r="11" stroke-width="5"/>
  </symbol>
</svg>

<div id="splash" class="splash" aria-hidden="true">
  <svg class="splash-logo" width="120" height="120" viewBox="0 0 100 100" aria-hidden="true">
    <rect width="100" height="100" rx="22" class="logo-bg"/>
    <path class="logo-road" d="M22 54 L42 74 L78 30" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/>
    <path class="logo-dash" d="M22 54 L42 74 L78 30" fill="none" stroke-width="3" stroke-dasharray="6 7"/>
    <circle class="logo-home" cx="22" cy="54" r="10" stroke-width="3"/>
    <circle class="logo-school" cx="78" cy="30" r="11" stroke-width="5"/>
  </svg>
  <div class="splash-word">Walk Check</div>
</div>

<header class="top" id="top">
  <a class="brand" href="#/" aria-label="Walk Check home">
    <svg width="28" height="28" aria-hidden="true"><use href="#logo"/></svg>
    <span>Walk Check</span>
  </a>
  <nav class="topnav" aria-label="Site">
    <a href="#/zones">Schools that closed</a>
    <a href="#/data">For City and HISD staff</a>
  </nav>
  <div class="lang" role="group" aria-label="Language">
    <button class="lang-btn is-on" data-lang="en" aria-pressed="true">English</button>
    <button class="lang-btn" data-lang="es" aria-pressed="false">Español</button>
  </div>
</header>

<main id="app" class="app" tabindex="-1"></main>

<div id="sheet-root"></div>
<div id="print-root" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>

</html>
