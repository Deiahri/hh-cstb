<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Walk Check</title>
    <meta name="description" content="Check your child's walk to an HISD elementary school: dangerous crossings and who to call." />
    <meta name="theme-color" content="#1F6E5A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231F6E5A'/%3E%3Cpath d='M22 54 L42 74 L78 30' fill='none' stroke='%23FAF6EE' stroke-width='16' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='22' cy='54' r='10' fill='%23E9A23B'/%3E%3C/svg%3E" />

  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="logo" viewBox="0 0 100 100">
        <rect width="100" height="100" rx="22" class="logo-bg" />
        <path class="logo-road" d="M22 54 L42 74 L78 30" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
        <path class="logo-dash" d="M22 54 L42 74 L78 30" fill="none" stroke-width="3" stroke-dasharray="6 7" />
        <circle class="logo-home" cx="22" cy="54" r="10" stroke-width="3" />
        <circle class="logo-school" cx="78" cy="30" r="11" stroke-width="5" />
      </symbol>
    </svg>

    <div id="splash" class="splash" aria-hidden="true">
      <svg class="splash-logo" width="120" height="120" viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="22" class="logo-bg" />
        <path class="logo-road" d="M22 54 L42 74 L78 30" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" pathLength="100" />
        <path class="logo-dash" d="M22 54 L42 74 L78 30" fill="none" stroke-width="3" stroke-dasharray="6 7" />
        <circle class="logo-home" cx="22" cy="54" r="10" stroke-width="3" />
        <circle class="logo-school" cx="78" cy="30" r="11" stroke-width="5" />
      </svg>
      <div class="splash-word">Walk Check</div>
    </div>

    <div id="root"></div>
    <div id="sheet-root"></div>
    <div id="print-root" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
